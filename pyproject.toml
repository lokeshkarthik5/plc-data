[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "openpyxl"
ignore_missing_imports = true
