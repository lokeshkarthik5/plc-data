name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --strict tankgauge/calibration.py tankgauge/packet.py

      - name: Test
        run: pytest

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name CSV_to_PLC app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: CSV_to_PLC-windows
          path: dist/CSV_to_PLC.exe
