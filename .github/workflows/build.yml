name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:  

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name CSV_to_PLC app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4 
        with:
          name: CSV_to_PLC-windows
          path: dist/CSV_to_PLC.exe